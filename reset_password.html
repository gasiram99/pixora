{% extends "base.html" %}
{% block title %}Reset password · Pixora{% endblock %}
{% block content %}
<section class="card auth-card reset-password-card">
    <h1>Reset password</h1>
    <p>Enter the six-digit code from your email and choose a new password.</p>
    <form method="POST" action="{{ url_for('reset_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="otp">Reset code</label>
        <input id="otp" name="otp" type="text" inputmode="numeric"
               autocomplete="one-time-code" pattern="[0-9]{6}"
               minlength="6" maxlength="6" required>
        <label for="new-password">New password</label>
        <input id="new-password" name="new_password" type="password"
               minlength="10" maxlength="128" autocomplete="new-password" required>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirm_password" type="password"
               minlength="10" maxlength="128" autocomplete="new-password" required>
        <button type="submit">Reset password</button>
    </form>
    <p class="auth-secondary-link">
        <a href="{{ url_for('forgot_password') }}">Request another code</a>
    </p>
</section>
{% endblock %}
