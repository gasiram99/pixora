{% extends "base.html" %}
{% block title %}Change password · Pixora{% endblock %}
{% block content %}
<section class="account-settings">
    <p class="eyebrow">ACCOUNT SETTINGS</p>
    <h1>Change password</h1>
    <p class="account-settings-intro">Use your current password to choose a new one.</p>
    <form method="POST" action="{{ url_for('change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="current-password">Current password</label>
        <input id="current-password" name="current_password" type="password"
               autocomplete="current-password" required>
        <label for="new-password">New password</label>
        <input id="new-password" name="new_password" type="password"
               minlength="10" maxlength="128" autocomplete="new-password" required>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirm_password" type="password"
               minlength="10" maxlength="128" autocomplete="new-password" required>
        <button type="submit">Save password</button>
    </form>
</section>
{% endblock %}
