{% extends "base.html" %}
{% block title %}Verify account · Pixora{% endblock %}
{% block content %}
<section class="card auth-card">
    <h1>Verify your account</h1>
    <p>Enter the verification code sent to your email address.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="otp">Verification code</label>
        <input id="otp" name="otp" type="text" inputmode="numeric"
               autocomplete="one-time-code" pattern="[0-9]{6}"
               minlength="6" maxlength="6" required>
        <button type="submit">Verify</button>
    </form>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" name="action" value="resend">Resend Code</button>
    </form>
</section>
{% endblock %}
