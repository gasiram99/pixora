{% extends "base.html" %}
{% block title %}Change username · Pixora{% endblock %}
{% block content %}
<section class="account-settings">
    <p class="eyebrow">ACCOUNT SETTINGS</p>
    <h1>Change username</h1>
    <p class="account-settings-intro">Your username is how people find and recognize you on Pixora.</p>
    <form method="POST" action="{{ url_for('change_username') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">New username</label>
        <input id="username" name="username" type="text"
               value="{{ request.form.get('username', session.get('username', '')) }}"
               minlength="3" maxlength="30" autocomplete="username" required>
        <label for="current-password">Current password</label>
        <input id="current-password" name="current_password" type="password"
               autocomplete="current-password" required>
        <button type="submit">Save username</button>
    </form>
</section>
{% endblock %}
