{% extends "base.html" %}
{% block title %}Forgot password · Pixora{% endblock %}
{% block content %}
<section class="card auth-card">
    <h1>Forgot password?</h1>
    <p>Enter your verified account email and we'll send you a reset code.</p>
    <form method="POST" action="{{ url_for('forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" maxlength="254"
               autocomplete="email" value="{{ email|default('') }}" required>
        <button type="submit">Send reset code</button>
    </form>
    <p class="auth-secondary-link"><a href="{{ url_for('login') }}">Back to login</a></p>
</section>
{% endblock %}
